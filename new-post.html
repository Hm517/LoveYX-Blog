<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#a54f68">
<title>文章标题 — LoveYX Blog</title>
<meta name="description" content="一篇碎碎念，记录生活中的小片段">
<style>

  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@400;500;600&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --paper: #f6f2eb;
    --card: #fffdf8;
    --raised: #efe9df;
    --hair: rgba(31, 27, 22, 0.10);
    --hair-strong: rgba(31, 27, 22, 0.18);
    --text: #1f1b16;
    --secondary: #5e554a;
    --muted: #7b7266;
    --accent: #a54f68;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  html { scroll-behavior: smooth; font-size: 16px; }
  body {
    font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--paper);
    color: var(--text);
    line-height: 1.75;
    min-height: 100vh;
    overflow-x: hidden;
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; position: relative; }
  @media (max-width: 768px) { .container { padding: 0 16px; } }

  .header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(246, 242, 235, 0.94);
    border-bottom: 1px solid var(--hair);
    backdrop-filter: blur(8px);
  }
  .header-inner { display: flex; align-items: center; justify-content: space-between; min-height: 64px; }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-family: 'Noto Serif SC', serif;
    font-size: 17px; font-weight: 500; color: var(--text); text-decoration: none;
  }
  .logo-icon { width: 28px; height: 28px; border-radius: 4px; object-fit: contain; }
  .nav { display: flex; gap: 4px; }
  .nav a {
    padding: 8px 12px; border-radius: 6px;
    font-size: 14px; color: var(--secondary); text-decoration: none;
    transition: background 140ms var(--ease), color 140ms var(--ease);
  }
  .nav a:hover { color: var(--text); background: var(--raised); }
  @media (max-width: 560px) { .nav a { padding: 8px; font-size: 13px; } }

  .hero { padding: 88px 0 64px; }
  .hero-inner {
    max-width: 1080px; margin: 0 auto; width: 100%; min-width: 0;
    display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
    gap: 64px; align-items: center;
  }
  .hero-copy { min-width: 0; }
  .hero-inner > * { min-width: 0; }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 4px 8px; border: 1px solid var(--hair); border-radius: 4px;
    font: 400 12px/16px 'IBM Plex Mono', monospace; color: var(--secondary);
    margin-bottom: 28px;
  }
  .hero-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .hero h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(32px, 4.4vw, 52px); font-weight: 500; letter-spacing: -0.02em;
    line-height: 1.18; margin-bottom: 20px; overflow-wrap: anywhere;
  }
  .hero p { font-size: 16px; color: var(--secondary); max-width: 32rem; line-height: 1.8; overflow-wrap: anywhere; }
  .hero-stats { display: flex; flex-wrap: wrap; gap: 24px; margin-top: 32px; }
  .hero-stat { display: flex; align-items: baseline; gap: 8px; }
  .hero-stat .num {
    font: 500 24px/1 'IBM Plex Mono', monospace;
    color: var(--text); font-variant-numeric: tabular-nums;
  }
  .hero-stat .label { font-size: 12px; color: var(--muted); }
  .hero-note {
    width: 100%; min-width: 0;
    border: 1px solid var(--hair); border-left: 2px solid var(--accent);
    border-radius: 8px; background: var(--card); padding: 28px;
  }
  .hero-note .note-label {
    font: 400 12px/16px 'IBM Plex Mono', monospace; color: var(--muted); margin: 0 0 20px;
  }
  .hero-note .note-date {
    font: 400 12px/16px 'IBM Plex Mono', monospace; color: var(--secondary); margin: 0 0 8px;
  }
  .hero-note h2 {
    font-family: 'Noto Serif SC', serif; font-size: 22px; font-weight: 500;
    line-height: 1.4; margin: 0 0 12px;
  }
  .hero-note .note-excerpt { font-size: 14px; color: var(--secondary); margin: 0 0 24px; }
  .hero-note a {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--accent); text-decoration: none;
  }
  @media (max-width: 900px) {
    .hero-inner { grid-template-columns: minmax(0, 1fr); gap: 40px; }
    .hero p { max-width: 100%; }
    .hero { padding: 64px 0 48px; }
  }

  .section { padding: 56px 0; }
  .section-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 24px; font-weight: 500; margin-bottom: 32px;
    display: flex; align-items: center; gap: 12px;
  }
  .section-title .icon { width: 20px; height: 20px; display: grid; place-items: center; }
  .section-title .icon svg { width: 18px; height: 18px; stroke: var(--muted); }

  .card-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .card {
    display: flex; flex-direction: column; gap: 12px;
    padding: 24px; border: 1px solid var(--hair); border-radius: 8px;
    background: var(--card); text-decoration: none; color: inherit;
    transition: background 140ms var(--ease), border-color 140ms var(--ease);
  }
  .card:hover { background: #fff; border-color: var(--hair-strong); }
  .card-grid > .card:first-child {
    grid-column: 1 / -1;
    display: grid; grid-template-columns: 160px minmax(0, 1fr);
    column-gap: 32px; align-items: start;
  }
  .card-grid > .card:first-child .card-category,
  .card-grid > .card:first-child .card-meta,
  .card-grid > .card:first-child .card-tags { grid-column: 1; }
  .card-grid > .card:first-child h3,
  .card-grid > .card:first-child > p { grid-column: 2; }
  .card-grid > .card:first-child h3 { font-size: 24px; }
  .card-category {
    width: fit-content; font: 400 12px/16px 'IBM Plex Mono', monospace;
    color: var(--accent);
  }
  .card h3 { font-family: 'Noto Serif SC', serif; font-size: 19px; font-weight: 500; line-height: 1.5; }
  .card p { font-size: 14px; color: var(--secondary); line-height: 1.7; }
  .card-meta {
    display: flex; flex-wrap: wrap; gap: 16px;
    font: 400 12px/16px 'IBM Plex Mono', monospace; color: var(--muted);
  }
  .card-meta span { display: inline-flex; align-items: center; gap: 6px; }
  .card-meta svg { width: 14px; height: 14px; stroke: var(--muted); }
  .card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
  .card-tag, .tag {
    padding: 2px 6px; border: 1px solid var(--hair); border-radius: 4px;
    font: 400 12px/16px 'IBM Plex Mono', monospace; color: var(--muted);
  }
  .about-card { max-width: 640px; }
  @media (max-width: 760px) {
    .card-grid { grid-template-columns: 1fr; }
    .card-grid > .card:first-child { grid-template-columns: 1fr; gap: 12px; }
    .card-grid > .card:first-child .card-category,
    .card-grid > .card:first-child .card-meta,
    .card-grid > .card:first-child .card-tags,
    .card-grid > .card:first-child h3,
    .card-grid > .card:first-child > p { grid-column: 1; }
  }

  .footer { border-top: 1px solid var(--hair); padding: 32px 0; margin-top: 40px; }
  .footer-inner { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
  .footer p { font: 400 12px/16px 'IBM Plex Mono', monospace; color: var(--muted); }
  .footer-links { display: flex; gap: 12px; }
  .footer-links a {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 6px; color: var(--muted);
    transition: background 140ms var(--ease), color 140ms var(--ease);
  }
  .footer-links a:hover { color: var(--text); background: var(--raised); }
  .footer-links svg { width: 16px; height: 16px; stroke: currentColor; }
  .footer-signature { height: 24px; width: auto; vertical-align: middle; opacity: 0.8; }

  article { padding: 48px 0 72px; }
  .article-header { margin-bottom: 40px; }
  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--secondary); text-decoration: none;
    margin-bottom: 28px; padding: 4px 8px; border-radius: 4px;
    transition: color 140ms var(--ease), background 140ms var(--ease);
  }
  .back-link:hover { color: var(--text); background: var(--raised); }
  .back-link svg { width: 16px; height: 16px; stroke: currentColor; }
  .category-badge {
    display: inline-flex; font: 400 12px/16px 'IBM Plex Mono', monospace;
    color: var(--accent); margin-bottom: 16px;
  }
  .article-header h1 {
    font-family: 'Noto Serif SC', serif; font-size: clamp(28px, 4vw, 40px);
    font-weight: 500; line-height: 1.28; letter-spacing: -0.01em; margin-bottom: 20px;
  }
  .article-meta {
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    font: 400 12px/16px 'IBM Plex Mono', monospace; color: var(--muted);
  }
  .article-meta span { display: inline-flex; align-items: center; gap: 6px; }
  .article-meta svg { width: 14px; height: 14px; stroke: var(--muted); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .article-header::after { content: ''; display: block; width: 32px; height: 2px; background: var(--accent); margin-top: 28px; }

  .article-content {
    font-size: 15px; line-height: 1.9;
    background: var(--card); border: 1px solid var(--hair); border-radius: 12px;
    padding: 40px 44px;
  }
  @media (max-width: 640px) { .article-content { padding: 24px 20px; } }
  .article-content h2 {
    font-family: 'Noto Serif SC', serif; font-size: 23px; font-weight: 500;
    margin: 40px 0 16px; padding-bottom: 8px;
    border-bottom: 1px solid var(--hair);
  }
  .article-content h3 { font-size: 18px; font-weight: 500; margin: 28px 0 12px; }
  .article-content h4 { font-size: 16px; font-weight: 500; margin: 24px 0 8px; }
  .article-content p { margin-bottom: 18px; }
  .article-content strong { color: var(--text); font-weight: 500; }
  .article-content ul, .article-content ol { margin-bottom: 18px; padding-left: 24px; }
  .article-content li { margin-bottom: 8px; }
  .article-content code {
    font-family: 'IBM Plex Mono', monospace; font-size: 13px;
    padding: 2px 6px; border-radius: 4px; background: var(--raised); color: var(--text);
  }
  .article-content pre {
    margin: 20px 0; padding: 20px 24px; background: #f2ede4;
    border: 1px solid var(--hair); border-radius: 8px; overflow-x: auto;
    font-size: 13px; line-height: 1.7;
  }
  .article-content pre code { background: none; padding: 0; }
  .article-content blockquote {
    border-left: 2px solid var(--accent); padding: 12px 20px; margin: 22px 0;
    background: var(--raised); border-radius: 0 6px 6px 0; color: var(--secondary);
  }
  .article-content img { max-width: 100%; border-radius: 8px; margin: 20px 0; }

</style>
